[package]
name = "wyss-console"
version = "0.2.0"
description = "Wyss Console desktop foundation"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "wyss-console"

[features]
default = ["desktop"]
# The mocks belong to the desktop suite. A dev-dependency would activate Tauri for native tests.
desktop = ["dep:tauri", "tauri/test", "dep:tauri-build", "dep:gtk3"]
native-ui = ["dep:gtk", "dep:base64"]
# Development only: a local protocol-2 application with a fixture child, to look at the
# window with it active. No build of the installed desktop enables it.
f8-dev = []
# The isolated candidate authority `wyss-f8-fixture`: a protocol-2 authority whose runtime is
# a fixture child, not Codex. No packaged build enables it, and the package check refuses its
# markers.
f8-fixture = []
# Development and isolated acceptance only: a desktop whose Claude Managed runtime is hosted by
# this process (not the authority) against a mock provider API, to look at and drive the M3 window
# with the real SDK offline. No packaged build enables it, and the package check refuses its marker.
m3-fixture = ["desktop", "tauri/custom-protocol"]
# The constrained B1 candidate (launch plan, pre-exec shim, workspace materializer/exporter) and its
# probe. Development and isolated acceptance only: no packaged build enables it, nothing in the
# product reaches it, and the package check refuses its marker.
b1-fixture = []

[[example]]
name = "f8_local_gui"
required-features = ["f8-dev", "desktop"]

[[example]]
name = "m3_fixture_gui"
required-features = ["m3-fixture"]

[[bin]]
name = "wyss-console"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "wyss-host"
path = "src/bin/wyss-host.rs"
test = false

[[bin]]
name = "wyss-console-native"
path = "src/bin/wyss-console-native/main.rs"
required-features = ["native-ui"]

[[test]]
name = "cli_help"
path = "tests/cli_help.rs"
required-features = ["desktop"]

[[test]]
name = "host_process_survival"
path = "tests/host_process_survival.rs"
required-features = ["desktop"]

[[bin]]
name = "wyss-f8-fixture"
path = "src/bin/wyss-f8-fixture.rs"
required-features = ["f8-fixture"]

[[bin]]
name = "wyss-b1-shim"
path = "src/bin/wyss-b1-shim.rs"
required-features = ["b1-fixture"]

[[bin]]
name = "wyss-b1-probe"
path = "src/bin/wyss-b1-probe.rs"
required-features = ["b1-fixture"]

[[test]]
name = "b1_process"
path = "tests/b1_process.rs"
required-features = ["b1-fixture"]

[[test]]
name = "f8_fixture_process"
path = "tests/f8_fixture_process.rs"
required-features = ["f8-fixture"]

[build-dependencies]
tauri-build = { version = "=2.7.5", optional = true, features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same GTK version Tauri resolves; used by desktop-native dialogs and editors.
# The current main window is opaque and does not request KWin blur.
gtk3 = { package = "gtk", version = "=0.18.2", optional = true }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_14"], optional = true }

[dependencies]
sha2 = "0.10.9"
ring = "=0.17.14"
hmac = "=0.12.1"
tauri = { version = "=2.12.5", optional = true, features = [] }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a split ratio must decode to the exact f64 that was encoded (contracts::m1).
serde_json = { version = "1", features = ["float_roundtrip"] }
# Accepted custody contract: restoration records are sealed with authenticated encryption; the key is
# generated from the OS random source. RustCrypto, no unsafe of our own, no network.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
zeroize = "1"
# Parse provider TOML for inventory and semantic validation of byte-preserving edits.
# Keep the pinned parser aligned with the dependency graph.
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse", "display"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
uuid = { version = "=1.27.0", features = ["v4"] }
time = { version = "=0.3.55", features = ["parsing", "formatting"] }

portable-pty = { version = "=0.9.0", default-features = false }
nix = { version = "=0.28.0", default-features = false, features = ["dir", "fs", "inotify", "poll", "signal", "process", "user", "socket"] }

# The lifecycle hashes the authority binary it installs. A development build of that
# binary is hundreds of megabytes, and an unoptimized SHA-256 takes seconds over it.
[profile.dev.package.sha2]
opt-level = 3
# Passphrase stretching is 600,000 rounds of the same hash.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3

[dev-dependencies]
# Test-only: a fault switch for the audit table (F8-16) is an authorizer on the connection.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks"] }
